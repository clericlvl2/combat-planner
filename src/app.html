<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Default (dark) theme-color; updated dynamically at runtime by src/lib/theme.ts. -->
		<meta name="theme-color" content="#101317" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Static, not injected via <svelte:head> (ADR-004): ADR-007 keeps `prerender = false`
		     on every route, so adapter-static's SPA fallback (this shell) is rendered with
		     SvelteKit's forced `ssr: false` — <svelte:head> content from +layout.svelte never
		     reaches the fallback's static HTML, only the client bundle at hydration. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- TODO M-phase: set <html lang>/<dir> client-side from the active locale (ADR-005). -->
		<!-- Theme boot (pre-paint). Every color token in tokens.css is scoped under
		     [data-theme="dark"|"light"]; without the attribute set before the first paint the page
		     renders with unresolved custom properties (white bg / black text) until hydration runs
		     applyTheme(). Reads the localStorage mirror of settings.theme written by
		     src/lib/theme.ts (THEME_STORAGE_KEY) — Dexie is async and unreachable here. Must stay
		     inline and synchronous; a deferred or external script paints too late.
		     `colorScheme` is set alongside it because the app stylesheet is a render-blocking
		     <link>: until it loads there is no `background` rule at all, so the browser paints its
		     default canvas — white, regardless of data-theme. Declaring the color scheme inline
		     makes that default canvas dark, which is what removes the white-to-dark flip without
		     duplicating any --bg token hex into this shell. -->
		<script>
			try {
				const t = localStorage.getItem('cp-theme') || 'system';
				const dark =
					t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
				document.documentElement.style.colorScheme = 'dark';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Bounded failure state. If the client bundle never executes (e.g. a stale precache
		     after a deploy, or a deep-link F5 whose modules 404 to this SPA fallback), the page
		     would otherwise sit on an empty canvas forever — a plausible but permanently dead app,
		     worse than an error. This timer swaps in a reload prompt; a normal boot cancels the
		     timer and removes this element from a top-level statement near the top of
		     +routes/+layout.svelte's <script> (W-049) — the earliest point that is genuine proof
		     the whole module graph fetched, parsed, and ran, well before this timer ever fires.
		     There is no framework JS by definition here, so the copy below is hardcoded English
		     rather than routed through Paraglide (ADR-005) — a deliberate, narrow i18n exception.

		     Hidden via an INLINE `display: none` (flipped to `flex` by the timer below), never via
		     the `hidden` attribute. `hidden` resolves to `display: none` in the UA stylesheet, which
		     an inline `display` declaration outranks; the only thing that would then hide this
		     element is Tailwind preflight's `[hidden]:where(:not([hidden=until-found])){display:none
		     !important}` — a rule that lives in the render-blocking app stylesheet. That stylesheet
		     is precisely what is missing in the failure this element exists for, so `hidden` would
		     paint an unstyled full-viewport error screen at 0ms over everything, on exactly the boot
		     it is supposed to rescue. -->
		<div
			id="boot-failed"
			style="position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: var(--bg); color: var(--text);"
		>
			<p style="margin: 0; font: 600 16px/1.4 system-ui, sans-serif;">Couldn't load the app</p>
			<p
				style="margin: 0; font: 400 14px/1.4 system-ui, sans-serif; color: var(--text-muted); max-width: 320px;"
			>
				Check your connection and try reloading.
			</p>
			<button
				type="button"
				onclick="location.reload()"
				style="margin-top: 4px; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 500 14px system-ui, sans-serif; cursor: pointer;"
			>
				Reload
			</button>
		</div>

		<script>
			// Bounded failure timer — see #boot-failed comment above. Cleared by a top-level
			// statement in +layout.svelte (W-049) on a normal boot, before it ever fires.
			//
			// 15000ms kept, re-justified against current numbers (W-049): the original 4264ms
			// cold-FCP floor (specs/reports/2026-07-29-boot-flash.md) predates response
			// compression (W-051) and is no longer representative — the same rig now measures a
			// cold `/` first paint of 672ms / FCP of 1536ms on Fast 3G (1.6Mbps/150ms RTT, CPU
			// 4x), and a 6480ms first paint on Slow 3G. Both are still well inside 15000ms (>2x
			// margin even against the Slow 3G number), and the teardown point above clears
			// earlier than either paint metric on a healthy boot regardless of network, so
			// there's no measurement here that would justify lowering it: only a
			// weaker-than-Slow-3G device or network could need it higher, and this rig doesn't
			// measure one, so 15000ms stays as the floor.
			window.__cpBootTimer = setTimeout(() => {
				var failed = document.getElementById('boot-failed');
				// Inline display, not `hidden` — see the #boot-failed comment above.
				if (failed) failed.style.display = 'flex';
			}, 15000);
		</script>
	</body>
</html>
