<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Default (dark) theme-color; updated dynamically at runtime by src/lib/theme.ts. -->
		<meta name="theme-color" content="#101317" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Static, not injected via <svelte:head> (ADR-004): ADR-007 keeps `prerender = false`
		     on every route, so adapter-static's SPA fallback (this shell) is rendered with
		     SvelteKit's forced `ssr: false` — <svelte:head> content from +layout.svelte never
		     reaches the fallback's static HTML, only the client bundle at hydration. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- TODO M-phase: set <html lang>/<dir> client-side from the active locale (ADR-005). -->
		<!-- Theme boot (pre-paint). Every color token in tokens.css is scoped under
		     [data-theme="dark"|"light"]; without the attribute set before the first paint the page
		     renders with unresolved custom properties (white bg / black text) until hydration runs
		     applyTheme(). Reads the localStorage mirror of settings.theme written by
		     src/lib/theme.ts (THEME_STORAGE_KEY) — Dexie is async and unreachable here. Must stay
		     inline and synchronous; a deferred or external script paints too late.
		     `colorScheme` is set alongside it because the app stylesheet is a render-blocking
		     <link>: until it loads there is no `background` rule at all, so the browser paints its
		     default canvas — white, regardless of data-theme. Declaring the color scheme inline
		     makes that default canvas dark, which is what removes the white-to-dark flip without
		     duplicating any --bg token hex into this shell. -->
		<script>
			try {
				const t = localStorage.getItem('cp-theme') || 'system';
				const dark =
					t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
				document.documentElement.style.colorScheme = 'dark';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Boot skeleton (warm-F5 fix). With `ssr: false` SvelteKit calls Svelte's `mount()`,
		     which only appends to the target above — nothing here clears this markup, so
		     src/routes/+layout.svelte's root `onMount` must remove #boot-skeleton (and
		     #boot-failed) as its first statement, before `await store.hydrate()`. Styled off the
		     same tokens the theme-boot script above already resolves via `data-theme`, so it is
		     correct in both themes without duplicating any hex value into this shell. Placed after
		     the mount target in DOM order so it paints on top of the real chrome for the one frame
		     where both could otherwise coexist. -->
		<div
			id="boot-skeleton"
			aria-hidden="true"
			style="position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);"
		>
			<div
				style="flex: none; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface);"
			>
				<div style="width: 24px; height: 24px; border-radius: 4px; background: var(--surface-3);"></div>
				<div style="width: 120px; height: 14px; border-radius: 4px; background: var(--surface-3);"></div>
			</div>
			<div style="flex: 1; padding: 16px;">
				<div
					style="max-width: 768px; height: 96px; margin: 0 auto; border-radius: 8px; background: var(--surface); border: 1px solid var(--border);"
				></div>
			</div>
		</div>

		<!-- Bounded failure state. If the client bundle never executes (e.g. a stale precache
		     after a deploy, or a deep-link F5 whose modules 404 to this SPA fallback), the
		     skeleton above would otherwise persist forever — a plausible but permanently dead app,
		     worse than a blank page. This timer swaps it for a reload prompt; a normal boot cancels
		     the timer and removes both elements from +layout.svelte's `onMount` well before it ever
		     fires. There is no framework JS by definition here, so the copy below is hardcoded
		     English rather than routed through Paraglide (ADR-005) — a deliberate, narrow i18n
		     exception. -->
		<div
			id="boot-failed"
			hidden
			style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: var(--bg); color: var(--text);"
		>
			<p style="margin: 0; font: 600 16px/1.4 system-ui, sans-serif;">Couldn't load the app</p>
			<p
				style="margin: 0; font: 400 14px/1.4 system-ui, sans-serif; color: var(--text-muted); max-width: 320px;"
			>
				Check your connection and try reloading.
			</p>
			<button
				type="button"
				onclick="location.reload()"
				style="margin-top: 4px; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 500 14px system-ui, sans-serif; cursor: pointer;"
			>
				Reload
			</button>
		</div>

		<script>
			// Bounded failure timer — see #boot-failed comment above. Cleared by the root layout's
			// onMount on a normal boot, before it ever fires. 15000ms is a floor derived from
			// measurement, not an arbitrary pick: a cold `/` load hit FCP at 4264ms under only
			// 4x CPU throttling on Fast 3G (see specs/reports/2026-07-29-boot-flash.md), a
			// mid-tier profile, not a worst case. This timeout must stay comfortably above that
			// measured cold-boot FCP so a slow-but-healthy boot on a weaker device or network is
			// never mistaken for a dead bundle.
			window.__cpBootTimer = setTimeout(function () {
				var skeleton = document.getElementById('boot-skeleton');
				if (skeleton) skeleton.remove();
				var failed = document.getElementById('boot-failed');
				if (failed) failed.hidden = false;
			}, 15000);
		</script>
	</body>
</html>
